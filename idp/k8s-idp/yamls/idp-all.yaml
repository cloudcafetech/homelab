apiVersion: v1
kind: ConfigMap
metadata:
  name: idp-db-init-sql
  namespace: idp-system
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS requests (
      id SERIAL PRIMARY KEY,
      resource_type VARCHAR(30) NOT NULL DEFAULT 'K8S_NAMESPACE',
      app_name VARCHAR(100) NOT NULL,
      env VARCHAR(20) NOT NULL DEFAULT 'dev',
      cpu VARCHAR(20) NOT NULL DEFAULT '500m',
      memory VARCHAR(20) NOT NULL DEFAULT '512Mi',
      storage VARCHAR(20) NOT NULL DEFAULT '10Gi',
      vm_os_image VARCHAR(100) DEFAULT 'rhel-9-image',
      cluster VARCHAR(100) NOT NULL,
      requester_email VARCHAR(150) NOT NULL,
      manager_email VARCHAR(150) NOT NULL,
      ticket_system VARCHAR(20) NOT NULL DEFAULT 'SERVICENOW',
      tracking_ticket_id VARCHAR(50),
      status VARCHAR(40) NOT NULL DEFAULT 'PENDING_APPROVAL',
      purpose TEXT DEFAULT NULL,      
      created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_requests_status ON requests(status);
    CREATE INDEX IF NOT EXISTS idx_requests_type ON requests(resource_type);
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: idp-system
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 0
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "secret"
        - name: POSTGRES_DB
          value: "idpdb"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        - name: init-sql-volume
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: init-sql-volume
        configMap:
          name: idp-db-init-sql
  volumeClaimTemplates:
  - metadata:
      name: pgdata
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: idp-system
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
  clusterIP: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: idp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailhog
  template:
    metadata:
      labels:
        app: mailhog
    spec:
      securityContext:
        fsGroup: 0
      containers:
      - name: mailhog
        image: mailhog/mailhog:latest
        ports:
        - containerPort: 1025
          name: smtp
        - containerPort: 8025
          name: web
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: idp-system
spec:
  ports:
  - port: 1025
    targetPort: 1025
    name: smtp
  - port: 8025
    targetPort: 8025
    name: web
  selector:
    app: mailhog
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: idp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 0
      containers:
      - name: grafana
        image: grafana/grafana:10.4.0
        env:
        - name: GF_SECURITY_ALLOW_EMBEDDING
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: "Viewer"
        ports:
        - containerPort: 3000
          name: http
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
      volumes:
      - name: grafana-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: idp-system
spec:
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  selector:
    app: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp-orchestrator
  namespace: idp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idp-orchestrator
  template:
    metadata:
      labels:
        app: idp-orchestrator
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 0
      containers:
      - name: orchestrator
        image: docker.io/prasenforu/idp-base:v1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          value: "postgres://postgres:secret@postgres.idp-system.svc:5432/idpdb"
        - name: SMTP_HOST
          value: "mailhog.idp-system.svc"
        - name: SMTP_PORT
          value: "1025"
        # Core configuration secrets for integration platforms
        - name: JIRA_HOST
          value: "https://atlassian.net"
        - name: JIRA_USER
          value: "jira-automation-service-account@company.com"
        - name: JIRA_TOKEN
          value: "your-jira-api-token"
        - name: SNOW_HOST
          value: "https://dev427345.service-now.com"
        - name: SNOW_USER
          value: "admin"
        - name: SNOW_PASSWORD
          value: "4/L0G^MCwzma"
        - name: GRAFANA_URL
          value: "http://192.168.0.160:30997"
          #value: "http://grafana.idp-system.svc"
        - name: GRAFANA_DASHBOARD_UID
          value: "k8s-cluster-ns-overview"
        volumeMounts:
        - name: src-volume
          mountPath: /app/src
        - name: db-volume
          mountPath: /app/db/init.sql
          subPath: init.sql
      volumes:
      - name: src-volume
        configMap:
          name: idp-source-code
      - name: db-volume
        configMap:
          name: idp-db-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: idp-orchestrator
  namespace: idp-system
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: idp-orchestrator
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: idp-ingress
  namespace: idp-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: idp.internal.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: idp-orchestrator
            port:
              number: 80

