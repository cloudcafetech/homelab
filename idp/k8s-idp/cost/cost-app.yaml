apiVersion: apps/v1
kind: Deployment
metadata:
  name: cost-app
  namespace: idp-system
  labels:
    app: cost-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cost-app
  template:
    metadata:
      labels:
        app: cost-app
    spec:
      # FIXES INGRESS LOCAL RESOLUTION ERROR OFF-LINE
      #hostAliases:
      #- ip: "192.168.0.160" # Map this domain to your active node host IP local route
      #  hostnames:
      #  - "opencost-api.local"
      securityContext:
        runAsUser: 1001
        runAsGroup: 0
        fsGroup: 0
      containers:
      - name: cost
        image: docker.io/prasenforu/idp-base:v3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: CLUSTER_1_NAME
          value: "rancher"
        - name: CLUSTER_1_URL
          value: "http://192.168.0.160:30904"
        - name: CLUSTER_2_NAME
          value: "kind"
        - name: CLUSTER_2_URL
          value: "http://cost-kind.apps.192.168.0.159.nip.io:9080"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "150m"
            memory: "256Mi"
        volumeMounts:
        # MOUNT 1: Mount server.js to the root folder required by image startup command
        - name: code-volume
          mountPath: /app/src/server.js
          subPath: server.js
        # MOUNT 2: Mount index.html inside the static asset folder
        - name: code-volume
          mountPath: /app/src/public/index.html
          subPath: index.html
      volumes:
      - name: code-volume
        configMap:
          name: cost-code
          items:
          - key: server.js
            path: server.js
          - key: index.html
            path: index.html
---
apiVersion: v1
kind: Service
metadata:
  name: cost
  namespace: idp-system
  labels:
    app: cost-app
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 32003
    protocol: TCP
    name: http
  selector:
    app: cost-app

