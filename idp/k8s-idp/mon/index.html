<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kubernetes Live Monitoring</title>
    <style>
        :root { --bg-color: #f8f9fa; --card-bg: #ffffff; --primary: #4f46e5; --text-main: #1f2937; --text-muted: #6b7280; --border: #e5e7eb; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 24px; }
        .controls-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; display: flex; gap: 20px; margin-bottom: 24px; }
        .control-group { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .control-group select { padding: 10px; border: 1px solid var(--border); border-radius: 6px; }
        .btn-refresh { background: var(--primary); color: white; border: none; border-radius: 6px; padding: 10px 20px; cursor: pointer; }
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px; }
        .kpi-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
        .table-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 32px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>
    <h1>Kubernetes Live Monitoring</h1>
    <div class="controls-card">
        <div class="control-group">
            <label>Kubernetes cluster</label>
            <select id="clusterSelect"><option value="">Loading...</option></select>
        </div>
        <div class="control-group">
            <label>Namespace</label>
            <select id="namespaceSelect"><option value="All namespaces">All namespaces</option></select>
        </div>
        <button class="btn-refresh" id="refreshBtn">🔄 Refresh</button>
    </div>
    <div class="kpi-grid">
        <div class="kpi-card"><h3>Nodes</h3><div id="kpiNodes">—</div></div>
        <div class="kpi-card"><h3>Pods</h3><div id="kpiPods">—</div></div>
        <div class="kpi-card"><h3>CPU Usage</h3><div id="kpiCpu">—</div></div>
        <div class="kpi-card"><h3>Mem Usage</h3><div id="kpiMemory">—</div></div>
    </div>
    <h2>Nodes</h2>
    <div class="table-container"><table><thead><tr><th>Node</th><th>CPU</th><th>Memory</th></tr></thead><tbody id="nodeTableBody"></tbody></table></div>
    <h2>Pods</h2>
    <div class="table-container"><table><thead><tr><th>Pod</th><th>Namespace</th><th>CPU</th><th>Memory</th></tr></thead><tbody id="podTableBody"></tbody></table></div>
    
    <!-- Points directly to browser.js file served by Express -->
    <script src="browser.js"></script>
</body>
</html>
