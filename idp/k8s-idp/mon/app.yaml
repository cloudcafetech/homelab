apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-dashboard
  namespace: idp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring-dashboard
  template:
    metadata:
      labels:
        app: monitoring-dashboard
    spec:
      containers:
      - name: dashboard
        image: docker.io/prasenforu/idp-base:v3
        ports:
        - containerPort: 3000
        env:
        - name: KUBECONFIG
          value: /app/secrets/kubeconfig/config
        - name: PORT
          value: "3000"
        volumeMounts:
        # --- Multi-Cluster Secret ---
        - name: kubeconfig-volume
          mountPath: /app/secrets/kubeconfig          
          readOnly: true
        # --- Multi-Cluster Secret ---          
        - name: code-volume
          mountPath: /app/src/server.js
          subPath: server.js
          readOnly: true
        - name: code-volume
          mountPath: /app/src/public/index.html
          subPath: index.html
          readOnly: true
        - name: code-volume
          mountPath: /app/src/public/browser.js
          subPath: browser.js
          readOnly: true
      volumes:
      - name: kubeconfig-volume
        secret:
          secretName: multi-cluster-kubeconfig
          defaultMode: 420
      - name: code-volume
        configMap:
          name: monitoring-code
          defaultMode: 420
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-dashboard
  namespace: idp-system
  labels:
    app: monitoring-dashboard
spec:
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 32000
  selector:
    app: monitoring-dashboard

