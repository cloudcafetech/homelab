apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-admin-sa
  namespace: idp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-admin-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:metrics-reader
subjects:
- kind: ServiceAccount
  name: dashboard-admin-sa
  namespace: idp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-admin-global
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: dashboard-admin-sa
  namespace: idp-system
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-admin-sa-token
  namespace: idp-system
  annotations:
    kubernetes.io/service-account.name: "dashboard-admin-sa"
type: kubernetes.io/service-account-token

