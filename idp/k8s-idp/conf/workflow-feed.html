<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K8s & VM IDP Dashboard Hub - Workflow Feed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .status-badge-pendingapproval { background-color: #FEF3C7; color: #D97706; border: 1px solid #F59E0B; }
    .status-badge-new { background-color: #EFF6FF; color: #2563EB; border: 1px solid #3B82F6; }
    .status-badge-inprogress { background-color: #E0F2FE; color: #0369A1; border: 1px solid #0EA5E9; }
    .status-badge-onhold { background-color: #F3F4F6; color: #4B5563; border: 1px solid #9CA3AF; }
    .status-badge-resolved { background-color: #ECFDF5; color: #059669; border: 1px solid #10B981; }
    .status-badge-closed { background-color: #F0FDF4; color: #166534; border: 1px solid #22C55E; }
    .status-badge-canceled { background-color: #FEF2F2; color: #DC2626; border: 1px solid #EF4444; }
    .status-badge-generic { background-color: #EEF2FF; color: #4F46E5; border: 1px solid #6366F1; }
  </style>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-900">

  <div class="flex min-h-screen">
    
    <!-- Sidebar Navigation Left Panel Block Layout -->
    <aside class="w-64 bg-indigo-900 text-white flex flex-col shadow-xl flex-shrink-0">
      <div class="p-5 border-b border-indigo-800 flex items-center space-x-3">
        <i class="fa-solid fa-cubes text-2xl text-indigo-300"></i>
        <span class="text-xl font-bold tracking-wide">IDP Core Portal</span>
      </div>
      
      <nav class="flex-1 p-4 space-y-2 text-sm font-medium">
        <a href="/" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-indigo-800 transition text-indigo-200">
          <i class="fa-solid fa-box w-5"></i>
          <span>IDP Dashboard Hub</span>
        </a>
        <a href="/request-apps" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-indigo-800 transition text-indigo-200">
          <i class="fa-solid fa-network-wired w-5"></i>
          <span>Request Apps Project</span>
        </a>
        <a href="/request-vm" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-indigo-800 transition text-indigo-200">
          <i class="fa-solid fa-desktop w-5"></i>
          <span>Request Virtual Machine</span>
        </a>
        <a href="/workflow" class="flex items-center space-x-3 p-3 rounded-lg bg-indigo-700 text-white transition shadow-inner">
          <i class="fa-solid fa-list-check w-5 text-indigo-300"></i>
          <span>Workflow Feed</span>
        </a>
        <a href="/monitoring" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-indigo-800 transition text-indigo-200">
          <i class="fa-solid fa-chart-line w-5"></i>
          <span>Live Monitoring</span>
        </a>
      </nav>
      
      <div class="p-4 border-t border-indigo-800 text-xs text-indigo-400 text-center">
        v1.0.0 &copy; Internal Platform Team
      </div>
    </aside>

    <!-- Main Workspace Area -->
    <main class="flex-1 p-8 overflow-y-auto">
      
      <!-- Top Header Row Component -->
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">All Requests Status</h2>
        <button id="reload-panel-btn" class="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white px-5 py-2.5 rounded-lg font-semibold shadow-md transition-all text-sm">
          <i class="fa-solid fa-rotate"></i>
          <span>Reload Panel</span>
        </button>
      </div>

      <!-- Real-Time Database Search Bar Interface -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 mb-6 flex flex-col md:flex-row md:items-center space-y-2 md:space-y-0 md:space-x-4">
        <label for="search-input" class="text-xs uppercase font-bold text-gray-500 tracking-wider whitespace-nowrap">Search Database</label>
        <div class="relative flex-1">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
            <i class="fa-solid fa-magnifying-glass"></i>
          </span>
          <input 
            type="text" 
            id="search-input" 
            placeholder="Search database dynamically by Application, VM, incident number, cluster node, or requester email address..." 
            class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all placeholder-gray-400"
          />
        </div>
      </div>

      <!-- Live Error Notification Alert Messaging Toast -->
      <div id="error-alert" class="hidden bg-red-50 border border-red-200 rounded-xl p-4 mb-6 flex items-start space-x-3 text-red-700 shadow-sm">
        <i class="fa-solid fa-triangle-exclamation text-lg mt-0.5 flex-shrink-0"></i>
        <div class="text-sm font-medium">Error loading provisioning requests. Could not sync with database storage arrays.</div>
      </div>

      <!-- Requests Cards Target Container Block -->
      <div id="requests-container" class="space-y-6">
        <div class="text-center py-12 text-gray-400">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 block"></i>
          <span class="text-sm font-medium">Loading orchestration feeds...</span>
        </div>
      </div>

    </main>
  </div>

  <script>
    let searchDebounceTimer;

    function getStatusBadgeStyleClass(statusString) {
      if (!statusString) return 'status-badge-generic';
      const normalCase = statusString.replace(/\s+/g, '').toLowerCase();
      
      switch (normalCase) {
        case 'pendingapproval': return 'status-badge-pendingapproval';
        case 'new': return 'status-badge-new';
        case 'inprogress': return 'status-badge-inprogress';
        case 'onhold': return 'status-badge-onhold';
        case 'resolved': return 'status-badge-resolved';
        case 'closed': return 'status-badge-closed';
        case 'canceled': return 'status-badge-canceled';
        default: return 'status-badge-generic';
      }
    }

    function renderRequestsListDOM(requestsArray) {
      const container = document.getElementById('requests-container');
      container.innerHTML = '';

      if (requestsArray.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-xl border border-gray-200 p-12 text-center text-gray-500 shadow-sm">
            <i class="fa-regular fa-folder-open text-4xl mb-3 text-gray-300 block"></i>
            <p class="font-medium text-base">No active provisioning records found matching the specified parameters.</p>
          </div>
        `;
        return;
      }

      requestsArray.forEach(req => {
        const isNamespace = req.resource_type === 'K8S_NAMESPACE';
        const typeIcon = isNamespace ? 'fa-network-wired text-indigo-600' : 'fa-desktop text-sky-600';
        const typeLabel = isNamespace ? 'Namespace' : 'VM';
        const contextString = req.cluster || (isNamespace ? 'Cluster Dev (On-Prem)' : 'Cluster Dev (On-Prem KubeVirt)');
          
        const badgeColorStyle = getStatusBadgeStyleClass(req.status);
        const printableStatus = req.status ? req.status : 'Pending Approval';

        const cardHTML = `
          <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6 hover:shadow-md transition-shadow relative overflow-hidden" data-id="${req.id}">
            
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-gray-100 pb-4 mb-4 gap-4">
              <div>
                <div class="flex items-center space-x-2.5">
                  <i class="fa-solid ${typeIcon} text-lg"></i>
                  <h3 class="text-lg font-bold text-gray-900">${typeLabel}: ${req.app_name || 'unnamed'}</h3>
                </div>
                <p class="text-xs text-gray-500 mt-1">
                  Target Cluster: <span class="font-medium text-gray-700">${contextString}</span> 
                  <span class="mx-1.5 text-gray-300">|</span> 
                  Ticket Ref: <span class="font-mono bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded font-bold">${req.tracking_ticket_id || 'NOT_ASSIGNED'}</span>
                </p>
              </div>
              
              <div class="flex items-center space-x-3 self-end sm:self-auto">
                <span class="px-3 py-1 rounded-full text-xs font-bold tracking-wide shadow-sm border ${badgeColorStyle}">
                  ${printableStatus}
                </span>
                <button 
                  onclick="triggerManualServiceNowSync(${req.id}, this)"
                  class="flex items-center space-x-1.5 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold text-xs px-3.5 py-2 rounded-lg shadow-sm transition-all"
                >
                  <i class="fa-solid fa-arrows-rotate"></i>
                  <span>Update</span>
                </button>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-y-3 gap-x-6 text-sm">
              <div class="flex flex-col space-y-1">
                <p class="text-gray-500">Environment: <span class="font-semibold text-gray-800">${req.env || 'dev'}</span></p>
                <p class="text-gray-500">Storage Footprint: <span class="font-semibold text-gray-800">${req.storage || '10Gi'}</span></p>
              </div>
              <div class="flex flex-col space-y-1">
                <p class="text-gray-500">CPU Allocated: <span class="font-semibold text-gray-800">${req.cpu || '500m'}</span></p>
                <p class="text-gray-500">OS Template: <span class="font-semibold text-gray-800">${isNamespace ? '' : (req.vm_os_image || 'rhel-9-image')}</span></p>
              </div>
              <div class="flex flex-col space-y-1">
                <p class="text-gray-500">Memory Capacity: <span class="font-semibold text-gray-800">${req.memory || '512Mi'}</span></p>
                <p class="text-gray-500">Requester: <span class="font-semibold text-gray-800 break-all text-xs text-blue-600">${req.requester_email || ''}</span></p>
              </div>
            </div>

            <div class="text-xs text-gray-400 mt-4 pt-3 border-t border-dashed border-gray-100 flex items-center space-x-1">
              <i class="fa-regular fa-envelope"></i>
              <span>Manager Approver Email Path:</span>
              <span class="font-medium text-gray-600">${req.manager_email || ''}</span>
            </div>

          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHTML);
      });
    }

    async function loadProvisioningRequestsFromDB(searchQuery = '') {
      const errorAlert = document.getElementById('error-alert');
      try {
        errorAlert.classList.add('hidden');
        const url = searchQuery ? `/api/requests?search=${encodeURIComponent(searchQuery)}` : '/api/requests';
        const response = await fetch(url);
        if (!response.ok) throw new Error('API server boundary connection failure.');
        
        const data = await response.json();
        renderRequestsListDOM(Array.isArray(data) ? data : []);
      } catch (err) {
        console.error(err);
        errorAlert.classList.remove('hidden');
        document.getElementById('requests-container').innerHTML = `
          <div class="bg-red-50 text-red-800 rounded-xl border border-red-200 p-6 font-medium text-center text-sm shadow-inner">
            <i class="fa-solid fa-circle-exclamation mr-2"></i>Failed to fetch real-time workflow information from the database tier.
          </div>
        `;
      }
    }

    async function triggerManualServiceNowSync(requestId, buttonElement) {
      const originalContent = buttonElement.innerHTML;
      buttonElement.disabled = true;
      buttonElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Syncing...</span>`;
      buttonElement.classList.replace('bg-emerald-500', 'bg-gray-400');

      try {
        const response = await fetch(`/api/requests/${requestId}/sync`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        const resultJson = await response.json();

        if (!response.ok) throw new Error(resultJson.error || 'Server processing error during lookup loops.');

        // Re-execute database sync to update visual cards array instantly
        const searchVal = document.getElementById('search-input').value;
        await loadProvisioningRequestsFromDB(searchVal);
      } catch (err) {
        console.error(err);
        alert(`Failed to execute real-time status synchronization updates:\n${err.message}`);
        buttonElement.disabled = false;
        buttonElement.innerHTML = originalContent;
        buttonElement.classList.replace('bg-gray-400', 'bg-emerald-500');
      }
    }

    function handleSearchInputEvent() {
      clearTimeout(searchDebounceTimer);
      const searchVal = document.getElementById('search-input').value;
      
      // Debounce loop execution to shield server infrastructure against constant keystroke hits
      searchDebounceTimer = setTimeout(() => {
        loadProvisioningRequestsFromDB(searchVal);
      }, 300);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadProvisioningRequestsFromDB();
      document.getElementById('search-input').addEventListener('input', handleSearchInputEvent);
      document.getElementById('reload-panel-btn').addEventListener('click', () => {
        document.getElementById('search-input').value = '';
        loadProvisioningRequestsFromDB();
      });
    });
  </script>
</body>
</html>
