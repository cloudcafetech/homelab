<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDP Portal - Cost Allocation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-900">
  <div class="flex min-h-screen">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-indigo-900 text-white flex flex-col shadow-xl flex-shrink-0">
      <div class="p-5 border-b border-indigo-800 flex items-center space-x-3">
        <i class="fa-solid fa-cubes text-2xl text-indigo-300"></i>
        <span class="text-xl font-bold tracking-wide">IDP Core Portal</span>
      </div>
      <nav class="flex-1 p-4 space-y-2 text-sm font-medium">
        <a href="/" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-indigo-800 transition text-indigo-200">
          <i class="fa-solid fa-box w-5"></i><span>IDP Dashboard Hub</span>
        </a>
        <a href="/request-apps" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-indigo-800 transition text-indigo-200">
          <i class="fa-solid fa-network-wired w-5"></i><span>Request Apps Project</span>
        </a>
        <a href="/request-vm" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-indigo-800 transition text-indigo-200">
          <i class="fa-solid fa-desktop w-5"></i><span>Request Virtual Machine</span>
        </a>
        <a href="/workflow" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-indigo-800 transition text-indigo-200">
          <i class="fa-solid fa-list-check w-5"></i><span>Workflow Feed</span>
        </a>
	<a href="/monitoring" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-indigo-800 transition text-indigo-200">
          <i class="fa-solid fa-chart-line w-5"></i><span>Live Monitoring</span>
        </a>
        <a href="/cost-allocation" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-indigo-800 transition text-indigo-200">
          <i class="fa-solid fa-dollar-sign w-5"></i><span>Cost Allocation</span>
        </a>
      </nav>
      <div class="p-4 border-t border-indigo-800 text-xs text-indigo-400 text-center">v1.0.0 &copy; Platform Team</div>
    </aside>

    <!-- Content Workspace Box Area Component -->
    <main class="flex-1 flex flex-col bg-gray-100">
      <div id="monitoring-loader" class="flex-1 flex flex-col items-center justify-center p-12 text-gray-500">
        <i class="fa-solid fa-chart-line fa-pulse text-4xl text-indigo-600 mb-3"></i>
        <p class="font-medium text-sm">Assembling dynamic clusters telemetry Grafana iframe matrix...</p>
      </div>
      
      <div id="iframe-wrapper" class="hidden flex-1 w-full h-full relative">
        <!-- Secure sandboxed iframe component dynamically receiving configurations from infrastructure APIs -->
        <iframe id="grafana-viewport" src="" class="absolute inset-0 w-full h-full border-none" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
    </main>
  </div>

  <script>
    async function initializeLiveGrafanaTelemetryFrame() {
      const loader = document.getElementById('monitoring-loader');
      const wrapper = document.getElementById('iframe-wrapper');
      const iframe = document.getElementById('grafana-viewport');

      try {
        const response = await fetch('/api/config/cost');
        if (!response.ok) throw new Error('Could not pull metrics settings profile configuration.');
        
        const config = await response.json();
        
        // Assemble target integration endpoint string
        const targetIframeUrl = `${config.costUrl}`;
        
        iframe.src = targetIframeUrl;
        
        // Expose viewport upon rendering stabilization
        loader.classList.add('hidden');
        wrapper.classList.remove('hidden');
      } catch (err) {
        console.error(err);
        loader.innerHTML = `
          <i class="fa-solid fa-circle-exclamation text-4xl text-red-500 mb-3"></i>
          <p class="font-bold text-red-800 text-sm">Failed to link live cost allocation frame.</p>
          <p class="text-xs text-gray-400 mt-1">Verify that COST_URL endpoint parameters are reachable from cluster paths.</p>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', initializeLiveGrafanaTelemetryFrame);
  </script>
</body>
</html>
