apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: demo-vm
  labels:
    vm: demo-vm
spec:
  dataVolumeTemplates:
  - metadata:
      name: demo-vm
      annotations:
        cdi.kubevirt.io/storage.bind.immediate.requested: "true"      
      labels:
        vm: demo-vm
    spec:
      pvc:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
      source:
        registry:
          # Use "pullMethod: node" for one time download image when VM create. But it uses 2 containers (importer + registry-source container), which uses more resource.
          #pullMethod: node
          # Use "pullMethod: pod" for every time download image when VM create. But it uses 1 containers (importer), which use less resource.          
          pullMethod: pod
          #url: docker://docker.io/kubevirt/cirros-container-disk-demo
          url: docker://quay.io/containerdisks/debian:12
  runStrategy: Always
  template:
    metadata:
      name: demo-vm
      labels:
        kubevirt.io/domain: demo-vm
        vm: demo-vm
    spec:
      domain:
        cpu:
          cores: 1
          sockets: 1
          threads: 1
        devices:
          disks:
          - disk:
              bus: virtio
            name: containerdisk
          - disk:
              bus: virtio
            name: cloudinitdisk
          interfaces:
          - name: default
            masquerade: {}
          rng: {}
        machine:
          type: q35
        resources:
          requests: { cpu: "500m", memory: "512Mi" }
          limits: { cpu: "750m", memory: "1Gi" }
      networks:
      - name: default
        pod: {}
      terminationGracePeriodSeconds: 0
      volumes:
      - name: containerdisk
        dataVolume:
          name: demo-vm
      - name: cloudinitdisk
        cloudInitNoCloud:
          userData: |-
            #cloud-config
            # For cirros image, user is cirros / gocubsgo
            hostname: demo-vm
            user: cloudcafe
            password: cloudcafe2675
            chpasswd: { expire: False }
            ssh_pwauth: True
            sudo: ALL=(ALL) NOPASSWD:ALL
---
apiVersion: v1
kind: Service
metadata:
  name: demo-vm-ssh
  labels:
    vm: demo-vm
spec:
  type: NodePort
  selector:
    kubevirt.io/domain: demo-vm
  ports:
  - name: ssh
    protocol: TCP
    port: 22
    targetPort: 22
